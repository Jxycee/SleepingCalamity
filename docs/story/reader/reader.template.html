<title>Sleeping Calamity Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&display=swap">
<style>
/* Layout: a paged reader. Chrome (bar, footer) is quiet; the page is the star. Notes live in a bottom sheet and a side drawer. */
:root {
  --bg: #e9e7e1;
  --paper: #f7f5ef;
  --ink: #25262b;
  --muted: #6d6e75;
  --rule: #d6d3ca;
  --accent: #3a5a8c;
  --ui: #f1efe8;
  --hl-y: rgba(240, 196, 52, .42);
  --hl-g: rgba(104, 184, 120, .40);
  --hl-p: rgba(226, 118, 154, .36);
  --hl-b: rgba(92, 150, 224, .34);
  --body: "Literata", Georgia, "Times New Roman", serif;
  --ui-font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs: 19px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --paper: #191c22; --ink: #d8d5cc; --muted: #8b8d96; --rule: #2c3038;
    --accent: #90b2ea; --ui: #14161b;
    --hl-y: rgba(220, 176, 40, .36); --hl-g: rgba(90, 170, 105, .34); --hl-p: rgba(214, 100, 140, .34); --hl-b: rgba(90, 140, 214, .34);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --paper: #191c22; --ink: #d8d5cc; --muted: #8b8d96; --rule: #2c3038;
  --accent: #90b2ea; --ui: #14161b;
  --hl-y: rgba(220, 176, 40, .36); --hl-g: rgba(90, 170, 105, .34); --hl-p: rgba(214, 100, 140, .34); --hl-b: rgba(90, 140, 214, .34);
  color-scheme: dark;
}
:root[data-tone="sepia"][data-theme="light"] {
  --bg: #dccfb2; --paper: #efe3c8; --ink: #3a2f22; --muted: #7b6a54; --rule: #cdbd9b; --accent: #8a4b25; --ui: #e6d9bb;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--ui-font);
  padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; }

#app { height: 100%; display: grid; grid-template-rows: auto 3px minmax(0, 1fr) auto; max-width: 1280px; margin: 0 auto; }
#top { display: flex; align-items: center; gap: 4px; padding: 6px 0; min-width: 0; }
#top .iconbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); position: relative; }
#top .iconbtn:hover { color: var(--ink); background: var(--ui); }
#crumb { flex: 1; min-width: 0; text-align: center; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em; }
#save { font-size: 12px; color: var(--muted); white-space: nowrap; padding: 0 6px; }
#save.bad { color: #b4472f; }
:root[data-theme="dark"] #save.bad { color: #f09a82; }
#count { position: absolute; top: 3px; right: 1px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--paper); font-size: 10px; line-height: 16px; text-align: center; font-weight: 600; padding: 0 4px; }
#prog { background: var(--rule); border-radius: 2px; overflow: hidden; }
#prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

#reader { min-height: 0; display: flex; justify-content: center; padding: 14px 0; }
#paper { width: 100%; max-width: 690px; min-height: 0; background: var(--paper); border-radius: 6px; box-shadow: 0 1px 0 var(--rule), 0 10px 30px rgba(0,0,0,.10); padding: 34px 40px; display: flex; }
#paper.spread { max-width: 1180px; padding: 38px 54px; }
@media (max-width: 560px) { #paper { padding: 22px 20px; border-radius: 0; } }
#stage { flex: 1; min-width: 0; min-height: 0; overflow: hidden; position: relative; touch-action: pan-y; -webkit-user-select: text; user-select: text; }
#meas { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; transition: none; }
.flow { position: relative; transition: transform .26s cubic-bezier(.3,.7,.2,1), opacity .2s; font-family: var(--body); font-size: var(--fs); line-height: 1.62; color: var(--ink);
  text-align: justify; hyphens: auto; -webkit-hyphens: auto; font-variation-settings: "opsz" 14; orphans: 2; widows: 2; }
@media (prefers-reduced-motion: reduce) { .flow { transition: none; } }
.flow p { margin: 0; text-indent: 1.4em; overflow-wrap: break-word; }
.flow p.tag, .flow h3.scene + p, .flow p.first { text-indent: 0; }
.flow p.tag { font-style: italic; color: var(--muted); font-size: .88em; margin: 0 0 .9em; text-align: left; }
.flow p.tag em { font-style: normal; }
.flow h1 { margin: .2em 0 1.4em; text-align: left; break-after: avoid; }
.flow h1 .kick { display: block; font: 600 .62em/1 var(--ui-font); letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: .9em; }
.flow h1 .ttl { display: block; font-size: 2em; font-weight: 400; font-style: italic; line-height: 1.12; text-wrap: balance; }
.flow h3.scene { margin: 1.6em 0 .5em; text-align: center; font: 600 .7em var(--ui-font); letter-spacing: .24em; color: var(--muted); break-after: avoid; }
.flow .brk { height: 1.4em; break-inside: avoid; }
.flow h2 { margin: 1.6em 0 .6em; font: 600 .78em var(--ui-font); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); text-align: left; break-after: avoid; }
.flow p.li { text-indent: 0; padding-left: 1.2em; position: relative; margin: .5em 0; text-align: left; font-size: .94em; }
.flow p.li::before { content: "–"; position: absolute; left: 0; color: var(--muted); }
.flow p.q { text-indent: 0; padding-left: 1em; border-left: 2px solid var(--rule); font-style: italic; margin: .8em 0; }
.flow strong { font-weight: 650; }
mark[data-a] { color: inherit; border-radius: 2px; cursor: pointer; padding: 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
mark.y { background: var(--hl-y); } mark.g { background: var(--hl-g); } mark.p { background: var(--hl-p); } mark.b { background: var(--hl-b); }
mark.n { box-shadow: inset 0 -2px 0 var(--muted); }
mark.c { box-shadow: inset 0 -2px 0 var(--accent); }
mark.done { opacity: .55; }
mark.flash { outline: 2px solid var(--accent); outline-offset: 1px; }

/* cover */
.flow .cover { text-align: left; }
.flow .cover h1 { margin-top: 1.2em; }
.flow .cover p { text-indent: 0; color: var(--muted); font-size: .92em; margin: 0 0 .8em; }
.flow .cover ol { list-style: none; margin: 1.4em 0 0; padding: 0; }
.flow .cover li { margin: 0; break-inside: avoid; }
.flow .cover li button { width: 100%; display: flex; gap: .9em; align-items: baseline; text-align: left; padding: .55em 0; border-bottom: 1px solid var(--rule); font: inherit; font-size: .95em; color: var(--ink); }
.flow .cover li button:hover .t { color: var(--accent); }
.flow .cover li .nn { font: 600 .7em var(--ui-font); letter-spacing: .14em; color: var(--muted); min-width: 4.2em; }
.flow .cover li .t { flex: 1; font-style: italic; }
.flow .cover li .m { font: 500 .72em var(--ui-font); color: var(--muted); }

#foot { display: flex; align-items: center; gap: 10px; padding: 4px 0 8px; }
#foot .iconbtn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
#foot .iconbtn:hover:not(:disabled) { color: var(--ink); background: var(--ui); }
#foot .iconbtn:disabled { opacity: .3; cursor: default; }
#pg { flex: 1; min-width: 0; accent-color: var(--accent); }
#where { font-size: 12px; color: var(--muted); min-width: 128px; text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { #where { min-width: 0; font-size: 11px; } }

/* floating panels */
.float { position: fixed; z-index: 30; background: var(--ui); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.25); color: var(--ink); }
#sheet { left: 50%; transform: translateX(-50%); bottom: calc(60px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100vw - 32px)); padding: 12px 14px; display: grid; gap: 10px; }
#sheet .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; }
.dot.y { background: #e7bf34; } .dot.g { background: #62b476; } .dot.p { background: #de6f97; } .dot.b { background: #5b92dd; }
.dot[aria-pressed="true"] { border-color: var(--ink); }
.btn { padding: 7px 12px; border-radius: 9px; font-size: 13px; font-weight: 500; border: 1px solid var(--rule); background: var(--paper); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.btn.danger { color: #b4472f; }
:root[data-theme="dark"] .btn.danger { color: #f09a82; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; }
.seg button { padding: 6px 11px; font-size: 13px; background: var(--paper); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
#note { width: 100%; min-height: 84px; max-height: 40vh; resize: vertical; border: 1px solid var(--rule); border-radius: 9px; padding: 9px 10px; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--ui-font); }
#sheet .quote { font: italic 13px/1.4 var(--body); color: var(--muted); max-height: 3.9em; overflow: hidden; }
#reply { border-left: 3px solid var(--accent); padding: 4px 0 4px 10px; font-size: 14px; line-height: 1.45; }
#reply b { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
#sstat { font-size: 12px; color: var(--muted); margin-right: auto; }

#scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.35); }
#drawer { top: 0; bottom: 0; left: 0; width: min(400px, 92vw); border-radius: 0 14px 14px 0; display: grid; grid-template-rows: auto auto 1fr; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); transition: transform .22s; }
#drawer[hidden] { display: grid !important; transform: translateX(-105%); visibility: hidden; }
#drawer .tabs { display: flex; gap: 6px; padding: 12px 14px 8px; align-items: center; }
#drawer .tabs .seg { flex: 1; }
#drawer .tabs .seg button { flex: 1; }
#drawer .x { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: var(--muted); }
#filters { display: flex; gap: 6px; padding: 0 14px 8px; flex-wrap: wrap; }
#filters button { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--rule); font-size: 12px; background: var(--paper); }
#filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#dbody { overflow: auto; padding: 0 14px 14px; min-height: 0; }
.toc button { display: flex; width: 100%; gap: 10px; align-items: baseline; text-align: left; padding: 11px 4px; border-bottom: 1px solid var(--rule); }
.toc .nn { font-size: 11px; letter-spacing: .12em; color: var(--muted); min-width: 22px; font-weight: 600; }
.toc .t { flex: 1; font: italic 16px var(--body); }
.toc .m { font-size: 12px; color: var(--muted); }
.toc button[aria-current="true"] .t { color: var(--accent); }
.item { display: block; width: 100%; text-align: left; border-left: 4px solid var(--rule); background: var(--paper); border-radius: 4px 9px 9px 4px; padding: 9px 11px; margin-bottom: 9px; }
.item.y { border-left-color: #e7bf34; } .item.g { border-left-color: #62b476; } .item.p { border-left-color: #de6f97; } .item.b { border-left-color: #5b92dd; }
.item .meta { display: flex; gap: 8px; font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.item .meta .tg { color: var(--accent); font-weight: 600; }
.item .q { font: italic 13px/1.4 var(--body); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.item .nt { font-size: 14px; line-height: 1.4; margin-top: 5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.item .rp { font-size: 13px; line-height: 1.4; margin-top: 6px; padding-left: 8px; border-left: 2px solid var(--accent); color: var(--ink); white-space: pre-wrap; }
.item.dn { opacity: .6; }
.empty { color: var(--muted); font-size: 14px; line-height: 1.5; padding: 18px 4px; }
#aa { right: 12px; top: calc(52px + env(safe-area-inset-top, 0px)); width: min(320px, calc(100vw - 32px)); padding: 14px; display: grid; gap: 14px; }
#aa label { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; display: block; margin-bottom: 6px; }
#aa input[type=range] { width: 100%; accent-color: var(--accent); }
#aa .check { display: flex; gap: 8px; align-items: center; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); }
#toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); font-size: 13px; padding: 8px 14px; border-radius: 9px; }
#btnBm[aria-pressed="true"] svg { fill: var(--accent); stroke: var(--accent); }
#btnBm[aria-pressed="true"] { color: var(--accent); }
.item .pg { color: var(--ink); font-weight: 600; }
.row2 { display: flex; gap: 6px; align-items: stretch; margin-bottom: 9px; }
.row2 .item { margin-bottom: 0; flex: 1; min-width: 0; }
.row2 .rm { width: 34px; border-radius: 9px; color: var(--muted); display: grid; place-items: center; border: 1px solid var(--rule); background: var(--paper); }
.row2 .rm:hover { color: #b4472f; }
</style>

<div id="app">
  <header id="top">
    <button class="iconbtn" id="btnToc" aria-label="Chapters and notes"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <div id="crumb">Sleeping Calamity</div>
    <span id="save" role="status" aria-live="polite"></span>
    <button class="iconbtn" id="btnBm" aria-label="Bookmark this page" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg></button>
    <button class="iconbtn" id="btnNotes" aria-label="Notes"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 11h8M8 15h5"/></svg><span id="count" hidden>0</span></button>
    <button class="iconbtn" id="btnAa" aria-label="Reading settings"><svg viewBox="0 0 24 24"><path d="M3 18 8 6l5 12M5 14h6M15 18l3.5-8L22 18M16.4 15h4.2"/></svg></button>
  </header>
  <div id="prog"><i></i></div>
  <main id="reader"><div id="paper"><div id="stage"><div id="flow" class="flow"></div><div id="meas" class="flow" aria-hidden="true"></div></div></div></main>
  <footer id="foot">
    <button class="iconbtn" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
    <input id="pg" type="range" min="0" max="0" value="0" aria-label="Page in chapter">
    <button class="iconbtn" id="next" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    <span id="where"></span>
  </footer>
</div>

<div id="sheet" class="float" hidden>
  <div class="quote" id="squote"></div>
  <div class="row" id="dots"></div>
  <div class="row" id="newrow">
    <button class="btn primary" id="bNote">Note for me</button>
    <button class="btn" id="bClaude">Note for Claude</button>
  </div>
  <div id="editbox" hidden style="display:grid;gap:10px">
    <div class="row"><div class="seg" id="tgt"><button data-t="me" aria-pressed="true">For me</button><button data-t="claude" aria-pressed="false">For Claude</button></div></div>
    <textarea id="note" placeholder="Write a note. It saves as you type." aria-label="Note"></textarea>
    <div id="reply" hidden><b>Claude</b><span id="replytxt"></span></div>
    <div class="row"><span id="sstat"></span><button class="btn" id="bDone">Mark resolved</button><button class="btn danger" id="bDel">Delete</button><button class="btn" id="bClose">Close</button></div>
  </div>
</div>

<aside id="drawer" class="float" hidden aria-label="Chapters and notes">
  <div class="tabs"><div class="seg"><button id="tabToc" aria-pressed="true">Chapters</button><button id="tabBm" aria-pressed="false">Bookmarks</button><button id="tabNotes" aria-pressed="false">Notes</button></div><button class="x" id="dClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div id="filters" hidden></div>
  <div id="dbody"></div>
</aside>

<div id="aa" class="float" hidden>
  <div><label for="fs">Text size</label><input id="fs" type="range" min="15" max="27" step="1"></div>
  <div><label>Page colour</label><div class="seg" id="themeSeg"><button data-th="auto">Auto</button><button data-th="light">Light</button><button data-th="sepia">Sepia</button><button data-th="dark">Dark</button></div></div>
  <label class="check"><input type="checkbox" id="spread"> Two pages side by side on wide screens</label>
</div>
<div id="scrim" hidden></div>
<div id="toast" hidden></div>

<script type="application/json" id="book">__BOOK__</script>
<script>
(function () {
  "use strict";
  var BOOK = JSON.parse(document.getElementById("book").textContent).chapters;
  var NCH = BOOK.length;
  var $ = function (s) { return document.querySelector(s); };
  var ls = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var jparse = function (s, d) { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } };
  document.documentElement.lang = "en";

  var settings = Object.assign({ fs: 19, theme: "auto", spread: true }, jparse(ls.get("sc.set"), {}));
  var S = { ch: 0, page: 0, pages: 1, step: 1, cols: 1, anns: new Map(), bms: new Map(), db: null, loaded: false };
  var stage = $("#stage"), flow = $("#flow"), paper = $("#paper");
  var COLORS = ["y", "g", "p", "b"];

  /* ---------- settings / theme ---------- */
  function applySettings() {
    var r = document.documentElement;
    r.style.setProperty("--fs", settings.fs + "px");
    r.removeAttribute("data-theme"); r.removeAttribute("data-tone");
    if (settings.theme === "light") r.setAttribute("data-theme", "light");
    if (settings.theme === "dark") r.setAttribute("data-theme", "dark");
    if (settings.theme === "sepia") { r.setAttribute("data-theme", "light"); r.setAttribute("data-tone", "sepia"); }
    $("#fs").value = settings.fs; $("#spread").checked = !!settings.spread;
    document.querySelectorAll("#themeSeg button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.th === settings.theme)); });
  }
  function saveSettings() { ls.set("sc.set", JSON.stringify(settings)); }

  /* ---------- save status ---------- */
  var statEl = $("#save");
  function setStatus(k) {
    var m = { saved: "Saved", saving: "Saving…", bad: "Not saved yet, retrying", local: "Saved on this device only", wait: "Connecting…", slow: "Notes may be out of date" };
    statEl.textContent = m[k] || ""; statEl.className = k === "bad" ? "bad" : "";
    var s = $("#sstat"); if (s) s.textContent = m[k] || "";
  }

  /* ---------- chapter content ---------- */
  function words(ch) { var n = 0; BOOK[ch - 1].blocks.forEach(function (b) { n += b[1].replace(/<[^>]+>/g, "").split(/\s+/).length; }); return n; }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function coverHTML() {
    var li = BOOK.map(function (c, i) {
      return '<li><button data-ch="' + (i + 1) + '"><span class="nn">CH ' + c.n + '</span><span class="t">' + c.title + '</span><span class="m">' + Math.round(words(i + 1) / 220) + ' min</span></button></li>';
    }).join("");
    return '<div class="cover"><h1><span class="kick">Draft for your sign-off</span><span class="ttl">Sleeping Calamity</span></h1>' +
      "<p>The whole story as a book, in seven chapters. Turn pages with the arrows, a tap on the left or right of the page, a swipe, or the keyboard.</p>" +
      "<p>Select any passage to highlight it and leave a note, either for yourself or for Claude. Notes marked <em>For Claude</em> are stored where Claude can read and answer them. Everything saves as you go, and the page remembers where you stopped.</p>" +
      '<ol>' + li + "</ol></div>";
  }
  function renderFlow() {
    if (S.ch === 0) { flow.innerHTML = coverHTML(); return; }
    flow.innerHTML = chapterHTML(S.ch);
    S.anns.forEach(function (a) {
      if (a.ch !== S.ch || !a.segs) return;
      var cls = a.color + (a.note ? " n" : "") + (a.target === "claude" ? " c" : "") + (a.status === "done" ? " done" : "");
      a.segs.forEach(function (g) {
        var el = flow.querySelector('[data-b="' + g.b + '"]');
        if (el) wrap(el, g.s, g.e, a.id, cls);
      });
    });
  }
  function chapterHTML(ch) {
    var c = BOOK[ch - 1], out = [];
    c.blocks.forEach(function (b, i) {
      var t = b[0], h = b[1];
      if (t === "h1") out.push('<h1 data-b="' + i + '"><span class="kick">Chapter ' + c.n + '</span> <span class="ttl">' + h + "</span></h1>");

  var toastT = null;
  function toast(m) { var t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 1600); }

  /* ---------- turning pages ---------- */
  $("#next").onclick = next; $("#prev").onclick = prev;
  $("#pg").oninput = function () { setPage(+this.value); };
  document.addEventListener("keydown", function (e) {
    var tg = e.target && e.target.tagName;
    if (tg === "TEXTAREA" || tg === "INPUT") { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && !e.shiftKey)) { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp" || (e.key === " " && e.shiftKey)) { e.preventDefault(); prev(); }
    else if (e.key === "Escape") { closeSheet(); closeDrawer(); $("#aa").hidden = true; }
  });
  var down = null;
  stage.addEventListener("pointerdown", function (e) { down = { x: e.clientX, y: e.clientY, t: Date.now() }; });
  stage.addEventListener("pointerup", function (e) {
    if (!down) return; var d = down; down = null;
    var dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 50 && e.pointerType === "touch") { if (dx < 0) next(); else prev(); return; }
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8 && Date.now() - d.t < 400) {
      var sel = window.getSelection(); if (sel && !sel.isCollapsed) return;
      var t = e.target; if (t.closest && t.closest("mark,button,a")) return;
      if (!sheet.hidden && !cur) return;
      var r = stage.getBoundingClientRect(), f = (e.clientX - r.left) / r.width;
      if (f < 0.33) prev(); else if (f > 0.67) next();
    }
  });
  var rz = null;
  window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(relayout, 150); });

  /* ---------- boot ---------- */
  applySettings();
  var saved = jparse(ls.get("sc.pos"), null);
  S.anns = new Map(); jparse(ls.get("sc.anns"), []).forEach(function (a) { if (a && a.id) S.anns.set(a.id, a); });
  jparse(ls.get("sc.bm"), []).forEach(function (a) { if (a && a.id) S.bms.set(a.id, a); });
  function boot() {
    if (saved && saved.ch > 0 && saved.ch <= NCH) openChapter(saved.ch, { b: saved.b || 0 }); else openChapter(0);
    updateCount();
  }
  function afterFonts() { boot(); }
  if (document.fonts && document.fonts.ready) {
    var done = false; var go = function () { if (!done) { done = true; afterFonts(); } };
    setTimeout(go, 1500); document.fonts.ready.then(go);
  } else afterFonts();
  window.addEventListener("load", function () { if (S.loaded) setTimeout(relayout, 50); });
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", function () { if (S.loaded) relayout(); });

  (async function connect() {
    setStatus("wait");
    var slow = setTimeout(function () { setStatus("slow"); }, 10000);
    var db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) { clearTimeout(slow); setStatus("local"); return; }
    S.db = db;
    try {
      db.collection("annotations").onSnapshot(function (snap) {
        clearTimeout(slow);
        var m = new Map();
        snap.docs.forEach(function (d) { var v = d.data(); if (v && !(Q.has("annotations/" + d.id) && Q.get("annotations/" + d.id).a.deleted)) m.set(d.id, Object.assign({}, v, { id: d.id })); });
        Q.forEach(function (it) { if (it.coll === "annotations" && !it.a.deleted && !m.has(it.a.id)) m.set(it.a.id, it.a); });
        var before = sig(); S.anns = m; saveLocal();
        if (sig() !== before && S.loaded) rerenderKeep();
        renderPanel(); updateCount();
        if (cur && S.anns.get(cur) && !sheet.hidden) openEdit(cur, false);
        if (!snap.metadata.fromCache && !Q.size) setStatus("saved"); else if (!Q.size && !statEl.textContent) setStatus("saved");
      }, function () { clearTimeout(slow); setStatus("slow"); });
      db.collection("bookmarks").onSnapshot(function (snap) {
        var m = new Map();
        snap.docs.forEach(function (d) { var v = d.data(); if (v && !(Q.has("bookmarks/" + d.id) && Q.get("bookmarks/" + d.id).a.deleted)) m.set(d.id, Object.assign({}, v, { id: d.id })); });
        Q.forEach(function (it) { if (it.coll === "bookmarks" && !it.a.deleted && !m.has(it.a.id)) m.set(it.a.id, it.a); });
        S.bms = m; saveLocal(); updateBm(); renderPanel();
      }, function () {});
      var pos = await db.doc("state/progress").get();
      var lp = jparse(ls.get("sc.pos"), null);
      if (pos.exists && !lp) { var v = pos.data(); if (v && v.ch) openChapter(v.ch, { b: v.b || 0 }); }
    } catch (e) { setStatus("slow"); }
  })();
})();
